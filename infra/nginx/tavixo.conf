# Separate vhost for a NEW subdomain. Never replace existing server blocks.
# Replace tavixo.example.com and TLS certificate paths before enabling.
server {
    listen 80;
    listen [::]:80;
    server_name tavixo.example.com;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/tavixo/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tavixo.example.com;
    ssl_certificate /etc/letsencrypt/live/tavixo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tavixo.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:6000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, do not accept client-supplied IPs for login throttling.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location / {
        proxy_pass http://127.0.0.1:6001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
