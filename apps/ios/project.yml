name: Tavixo
options:
  bundleIdPrefix: mx.com.nut
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: MC2W678MVZ
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Tavixo:
    info:
      path: Tavixo/Info.plist
      properties:
        UIAppFonts: [Manrope-Variable.ttf]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    type: application
    platform: iOS
    sources:
      - path: Tavixo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.com.nut.tavixo
        MARKETING_VERSION: '0.2.0'
        CURRENT_PROJECT_VERSION: '2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tavixo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
  TavixoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TavixoTests]
    dependencies:
      - target: Tavixo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  TavixoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TavixoUITests]
    dependencies:
      - target: Tavixo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Tavixo:
    build:
      targets:
        Tavixo: all
    test:
      targets: [TavixoTests, TavixoUITests]
